# FogApp 로컬/배포 컨테이너 구성
#
# DB만 띄우기(서버는 IDE에서 실행):  docker compose up -d db
# 전부 띄우기:                        docker compose up -d
# 종료:                               docker compose down       (데이터 유지)
# 초기화:                             docker compose down -v    (⚠️ 볼륨까지 삭제 — 사진도 사라진다)

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: fogapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fogapp}
      POSTGRES_USER: ${DB_USERNAME:-fogapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fogapp}
    # ⚠️ 127.0.0.1 을 빼지 말 것. 호스트 IP 를 생략하면 도커가 0.0.0.0 에 묶어,
    #    같은 네트워크(학교·카페 와이파이)의 누구나 이 Postgres 에 접속을 시도할 수 있다.
    #    이 포트는 로컬 개발 편의용이다 — server 컨테이너는 이 매핑이 아니라 컴포즈
    #    네트워크로 db 에 붙으므로(아래 DB_HOST: db), 루프백으로 잠가도 깨지는 것이 없다.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - fogapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fogapp} -d ${DB_NAME:-fogapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: fogapp-server
    restart: unless-stopped
    depends_on:
      db:
        # 단순 depends_on 은 "컨테이너가 떴다"까지만 본다. Postgres 가 아직 접속을
        # 못 받는 상태에서 서버가 기동하면 Flyway 마이그레이션이 실패한다.
        condition: service_healthy
    environment:
      # 컨테이너 간 통신은 서비스 이름으로 한다 — localhost 는 자기 자신이다.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fogapp}
      DB_USERNAME: ${DB_USERNAME:-fogapp}
      DB_PASSWORD: ${DB_PASSWORD:-fogapp}

      # ⚠️ 인증 사진 저장 위치. 아래 fogapp_photos 볼륨과 반드시 같아야 한다(#76, 7-7).
      VISIT_PHOTO_STORAGE_PATH: /app/data/visit-photos
      # 고아 사진 정리 배치는 배포에서 켠다. 로컬에서 파일이 예고 없이 사라지는 게
      # 싫으면 .env 에서 false 로 둘 것.
      VISIT_PHOTO_CLEANUP_ENABLED: ${VISIT_PHOTO_CLEANUP_ENABLED:-true}

      # Firebase ID 토큰 검증(#4). 키를 아직 못 받았으면 false 로 두면 되고,
      # 그 경우 /api/health 외 모든 API 가 401 을 돌려준다.
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/serviceAccountKey.json

      # ⚠️ .env 에 적어도 여기 없으면 컨테이너에 전달되지 않는다. 조용히 무시되고
      #    application.yml 의 기본값이 쓰인다 — 에러도 경고도 없다(#144 에서 발견).
      #    수집 설정을 새로 추가하면 이 목록에도 반드시 추가할 것.
      #
      # ⚠️ 기본값은 application.yml 과 같아야 한다. `${VAR:-}` 로 두면 빈 문자열이
      #    application.yml 의 기본값을 덮어써 오히려 망가진다.
      TOUR_API_SERVICE_KEY: ${TOUR_API_SERVICE_KEY:-}
      TOUR_API_BASE_URL: ${TOUR_API_BASE_URL:-https://apis.data.go.kr/B551011/KorService2}
      TOUR_API_OPERATION_SUFFIX: ${TOUR_API_OPERATION_SUFFIX:-2}
      TOUR_COLLECT_ON_STARTUP: ${TOUR_COLLECT_ON_STARTUP:-false}
      TOUR_COLLECT_AREA_CODES: ${TOUR_COLLECT_AREA_CODES:-1,6,39}
      TOUR_COLLECT_OVERVIEW_MAX_PER_RUN: ${TOUR_COLLECT_OVERVIEW_MAX_PER_RUN:-200}

      VISIT_RADIUS_METERS: ${VISIT_RADIUS_METERS:-100}
      VISIT_MAX_PHOTO_BYTES: ${VISIT_MAX_PHOTO_BYTES:-5242880}
      VISIT_MAX_PHOTO_BYTES_PER_USER: ${VISIT_MAX_PHOTO_BYTES_PER_USER:-209715200}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # ⚠️ 이게 없으면 컨테이너를 재시작할 때마다 인증 사진이 전부 사라지고
      #    visits.photo_url 은 깨진 링크만 남는다(#76). 백업 대상에도 포함할 것.
      - fogapp_photos:/app/data/visit-photos
      # ⛔ 서버 관리자 키. 읽기 전용으로 붙이고 이미지에는 굽지 않는다.
      #    secrets/ 는 .gitignore 처리돼 있다 — 커밋 금지.
      - ./secrets:/app/secrets:ro

volumes:
  fogapp_pgdata:
  # 인증 사진(#48, #76). down -v 로 지우면 이미 인증된 방문의 사진이 함께 사라진다.
  fogapp_photos:

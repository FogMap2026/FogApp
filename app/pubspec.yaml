name: fogapp
description: "FogApp — 안개 지도 탐험형 여행 플랫폼"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # 지도 (Naver Maps)
  flutter_naver_map: ^1.3.0

  # 위치 / GPS
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  flutter_compass: ^0.8.1

  # 백그라운드 근접 알림 (#135). FCM(firebase_messaging)은 서버가 보내는 푸시(6-4)용이고,
  # 이건 기기 안에서 자체적으로 띄우는 로컬 알림이라 별개다.
  flutter_local_notifications: ^22.3.0

  # 백그라운드 추적 on/off 설정 보관 (#135) — 서버에 둘 이유가 없는 기기별 설정이다.
  shared_preferences: ^2.5.5

  # 카메라 / 사진 인증
  camera: ^0.11.0
  image_picker: ^1.1.2

  # 네트워크
  dio: ^5.5.0

  # Firebase (Auth / Firestore / Messaging)
  # Storage는 쓰지 않는다 — 인증 사진은 서버가 직접 보관한다(#48, 팀 결정 B안:
  # Firebase Storage가 무료 요금제에서 버킷 생성이 막혀 채택 불가).
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_messaging: ^15.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/geo/

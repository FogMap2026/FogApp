server:
  port: 8080

spring:
  application:
    name: fogapp-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fogapp}
    username: ${DB_USERNAME:fogapp}
    password: ${DB_PASSWORD:fogapp}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 스키마는 Flyway가 소유한다. Hibernate는 엔티티-스키마 일치만 검증.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # 인증 사진 업로드(#48). visit.max-photo-bytes 와 함께 움직여야 한다 —
      # 여기가 더 작으면 서비스 검증에 닿기 전에 컨테이너가 먼저 잘라낸다.
      max-file-size: ${VISIT_MAX_PHOTO_BYTES:5242880}
      max-request-size: ${VISIT_MAX_REQUEST_SIZE:6291456}

# 한국관광공사 TourAPI (스팟 수집 #5). 서비스 키는 환경 변수로 주입(.env 참고).
tour:
  api:
    service-key: ${TOUR_API_SERVICE_KEY:}
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    # 오퍼레이션 이름 끝 버전 숫자. base-url 의 KorService 버전과 반드시 짝이어야 한다
    # (KorService2 + areaBasedList2). 한쪽만 바꾸면 404 가 난다.
    operation-suffix: ${TOUR_API_OPERATION_SUFFIX:2}
    mobile-app: FogApp
    mobile-os: ETC
  # 수집 배치 설정. on-startup=true 로 켜면 기동 시 지정 지역을 수집한다(기본 off).
  collect:
    on-startup: ${TOUR_COLLECT_ON_STARTUP:false}
    area-codes: ${TOUR_COLLECT_AREA_CODES:1,6,39}
    num-of-rows: 100
    max-pages: 10
    # 한 번 실행에 소개글을 채울 최대 스팟 수(#100). 상세조회는 스팟 1건당 1회라
    # 목록 수집보다 비싸다 — 남은 것은 다음 실행이 이어서 채운다.
    overview-max-per-run: ${TOUR_COLLECT_OVERVIEW_MAX_PER_RUN:200}

# 방문 인증 (#48).
# ⚠️ radius-meters 는 앱의 근접 감지(#45)가 쓰는 값과 반드시 같아야 한다.
#    어긋나면 "화면엔 인증 가능인데 서버가 거부"하는 버그가 된다. 변경 시 앱 상수도 함께 변경할 것.
visit:
  radius-meters: ${VISIT_RADIUS_METERS:100}
  # 인증 사진 저장 위치. Firebase Storage 는 무료(Spark) 요금제에서 버킷 생성이 막혀
  # 사진만 서버가 직접 보관한다(팀 결정 B안 — 로그인·푸시는 Firebase 그대로).
  # ⚠️ 배포 시 이 경로를 영속 볼륨에 마운트할 것. 재시작으로 사라지면 인증 사진이 유실된다.
  photo-storage-path: ${VISIT_PHOTO_STORAGE_PATH:./data/visit-photos}
  # 사진 1장당 허용 최대 바이트(기본 5MB). 아래 multipart 제한과 함께 움직여야 한다.
  max-photo-bytes: ${VISIT_MAX_PHOTO_BYTES:5242880}
  # 사용자 한 명의 총 사용량 상한(기본 200MB ≈ 5MB 사진 40장). 스팟당 1장만 유지해도
  # 전국 스팟이 수만 개라 총량으로 한 번 더 막는다. 무제한으로 두지 말 것.
  max-photo-bytes-per-user: ${VISIT_MAX_PHOTO_BYTES_PER_USER:209715200}
  # 인증되지 않은 사진을 남겨두는 시간(#76). 업로드 직후는 아직 참조가 없는 게 정상이라
  # 유예를 준다. 너무 짧으면 사용자가 사진을 확인하는 동안 파일이 사라진다.
  photo-retention-hours: ${VISIT_PHOTO_RETENTION_HOURS:24}
  # 고아 사진 정리 배치(#76). 기본 off — 로컬·CI 에서 파일이 예고 없이 사라지지 않게 한다.
  # 배포 환경에서 켠다.
  photo-cleanup:
    enabled: ${VISIT_PHOTO_CLEANUP_ENABLED:false}
    cron: ${VISIT_PHOTO_CLEANUP_CRON:0 10 4 * * *}

# Firebase (ID 토큰 검증) — 기본 비활성. 실제 배포/연동 시 FIREBASE_ENABLED=true 로 켠다.
# 자격증명은 서비스 계정 JSON 경로(FIREBASE_SERVICE_ACCOUNT_PATH) 또는 GOOGLE_APPLICATION_CREDENTIALS 사용.
firebase:
  enabled: ${FIREBASE_ENABLED:false}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

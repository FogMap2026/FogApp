name: CI

on:
  push:
    branches: [main, dev]
  # ⚠️ branches 필터를 두지 않는다. base 를 main·dev 로 제한하면 스택 PR
  # (base 가 다른 feature 브랜치인 PR)에서 CI 가 아예 돌지 않는다 — 체크 목록이
  # 비어 있어 "통과"로 오해하기 쉬운데, 실은 실행조차 안 된 상태다(#89 에서 발견).
  # 아래 Detect changes 가 변경 없는 잡을 건너뛰므로 실행 비용은 거의 늘지 않는다.
  pull_request:
  # 손으로 돌릴 수 있게 열어 둔다. 없으면 "코드는 그대로인데 결과물만 다시 필요한"
  # 경우에 방법이 없다 — 대표적으로 배포 주소가 바뀌어 APK 를 다시 구울 때다.
  # APK 는 secrets.API_BASE_URL 을 빌드 타임에 굽기 때문에(아래 apk 잡), 시크릿만
  # 바꾸고 재실행하면 될 것 같지만 그렇지 않다. 과거 실행을 rerun 하면 paths-filter 가
  # "지금"의 dev 를 다시 비교해 app=false 로 판정하고 잡을 통째로 건너뛴다.
  workflow_dispatch:

jobs:
  # 변경된 영역 감지 — 관련 없는 잡은 건너뛴다.
  #
  # ⚠️ 수동 실행(workflow_dispatch)일 때는 필터를 무시하고 전부 true 로 둔다.
  #    수동 실행의 목적이 "변경과 무관하게 결과물을 다시 만드는 것"이라, 필터를
  #    그대로 태우면 아무 잡도 돌지 않아 실행 자체가 무의미해진다.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      server: ${{ steps.filter.outputs.server == 'true' || github.event_name == 'workflow_dispatch' }}
      container: ${{ steps.filter.outputs.container == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
            server:
              - 'server/**'
            container:
              - 'server/**'
              - 'docker-compose.yml'

  app:
    name: Flutter App
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      # 플랫폼 폴더 생성 (lib/ 는 유지)
      - name: Generate platform folders
        run: flutter create .

      # flutter create 가 만든 템플릿 기본 테스트는 우리 구조와 달라 제거.
      # (우리 테스트는 app/test/ 에 있고, 아래 Test 스텝이 그걸 돌린다)
      - name: Remove template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # ⚠️ 이 스텝을 지우지 말 것(#139).
      #
      # 오랫동안 analyze 만 돌고 test 가 빠져 있었다. app/test/ 에 테스트가 8개 있는데
      # CI 는 한 번도 실행한 적이 없어서, 앱 PR 의 초록불은 "정적 분석을 통과했다" 는
      # 뜻이었지 "테스트가 통과했다" 는 뜻이 아니었다.
      #
      # 서버 잡은 gradle build 가 test 를 포함해 계속 돌고 있었기 때문에 초록불의 의미가
      # 서버와 앱에서 서로 달랐고, 그래서 오래 눈에 띄지 않았다.
      - name: Test
        run: flutter test

  # 설치 가능한 Android APK 를 만들어 아티팩트로 올린다.
  #
  # 팀원이 Flutter·Android SDK 를 설치하지 않고도 실기기에서 결과물을 확인할 수 있게 하려는
  # 목적이다. 실행 페이지의 Artifacts 에서 apk 를 받아 폰에 설치하면 된다(출처를 알 수 없는
  # 앱 설치 허용 필요).
  #
  # 디버그 빌드인 이유: 릴리스 서명 키(keystore)가 없어도 설치되는 APK 가 나온다.
  # 스토어 배포용이 아니라 "지금 만든 걸 눈으로 본다" 가 목적이라 이걸로 충분하다.
  apk:
    name: Android APK
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # app/android 는 Gradle 9.1 · AGP 9.0 을 쓴다(app/android/gradle/wrapper 참고).
      # Gradle 9 는 JDK 17 이상을 요구하며, AGP 9 조합에서는 21 이 안전하다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 두 값은 코드가 --dart-define 으로 받게 돼 있다(app/lib/main.dart, api_client.dart).
      # 시크릿이 비어 있어도 빌드는 되지만, NAVER_MAP_CLIENT_ID 가 없으면 지도가 뜨지 않는다.
      #
      # API_BASE_URL 은 저장소 시크릿에 배포 주소를 넣어 둔다. 값이 빌드 타임에 APK 안으로
      # 구워지므로, 주소가 바뀌면 시크릿을 고친 뒤 이 워크플로를 수동 실행해 다시 구워야 한다.
      #   gh workflow run ci.yml --repo FogMap2026/FogApp --ref dev
      # (기본값 10.0.2.2 는 안드로이드 에뮬레이터에서 호스트를 가리키는 주소다.)
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fogapp-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # 스토어에 올릴 릴리스 APK(7-6, 원스토어). 위 apk 잡의 디버그 빌드와는 목적이 다르다 —
  # 저건 팀 내부 확인용이고 이건 제출물이다. 둘 다 필요해서 잡을 나눴다.
  #
  # ⚠️ 서명 키가 없으면 이 잡은 통째로 건너뛴다. 디버그 키로 서명된 "릴리스" APK 를
  #    만들어 두면 스토어가 거부하는데, 파일 이름만 보고 올릴 수 있게 되기 때문이다.
  #    시크릿 4개(KEYSTORE_BASE64·KEYSTORE_PASSWORD·KEY_ALIAS·KEY_PASSWORD)가 있어야 돈다.
  #
  # 키스토어는 base64 로 시크릿에 넣고 여기서 복원한다 — 바이너리는 시크릿에 그대로 못 넣는다.
  release-apk:
    name: Release APK
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      # 시크릿이 없는 PR(포크 등)에서는 조용히 끝낸다. 아래 스텝들이 이 값을 본다.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::서명 키 시크릿이 없어 릴리스 APK 를 만들지 않습니다."
          fi

      - name: Restore keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"

      - name: Install dependencies
        if: steps.signing.outputs.available == 'true'
        run: flutter pub get

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      # 디버그 키로 서명된 것이 릴리스 산출물로 나가면 스토어에서야 알게 된다.
      # 서명 주체를 확인해 debug 이면 실패시킨다.
      #
      # ⚠️ keytool -printcert -jarfile 을 쓰지 말 것. 그건 v1(JAR) 서명만 읽는데,
      #    요즘 AGP 는 v2/v3 로만 서명하는 경우가 있어 "서명이 없다" 로 보인다.
      #    apksigner 는 v1~v4 를 전부 읽는다. (실제로 이 함정에 한 번 빠졌다)
      #
      # ⚠️ 파이프라인 결과를 그대로 변수에 받지 말 것. shell 이 bash -e 라
      #    grep 이 아무것도 못 찾으면 그 줄에서 스텝이 죽어, 아래 판정에 도달하지 못한다.
      - name: Verify signing identity
        if: steps.signing.outputs.available == 'true'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner 를 찾지 못했습니다 — 서명을 검증할 수 없습니다."
            exit 1
          fi
          echo "apksigner: $APKSIGNER"

          CERTS=$("$APKSIGNER" verify --print-certs --verbose "$APK") || {
            echo "::error::APK 서명 검증에 실패했습니다."
            exit 1
          }
          echo "$CERTS"

          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::디버그 키로 서명됐습니다 — 스토어에 올릴 수 없습니다."
            exit 1
          fi
          if ! echo "$CERTS" | grep -q "CN=FogApp"; then
            echo "::error::기대한 릴리스 키(CN=FogApp)로 서명되지 않았습니다."
            exit 1
          fi
          echo "릴리스 키로 서명됐습니다."

      - name: Upload release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fogapp-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  server:
    name: Spring Boot Server
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Spring Boot 3.3.x 는 Gradle 8.x 필요 (9.x 는 호환 불가)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon

  # 서버 이미지가 실제로 빌드되고, 뜨고, 요청을 받는지 확인한다(#86).
  # Dockerfile 이 깨진 건 배포 직전에 알게 되면 늦다.
  container:
    name: Server Container
    needs: changes
    if: ${{ needs.changes.outputs.container == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 빌드 성공 != 동작. 이미지를 만들고 DB 와 함께 실제로 기동시킨다 —
      # Flyway 마이그레이션 실패나 잘못된 ENTRYPOINT 는 빌드만으로는 안 잡힌다.
      # (compose 가 server 이미지를 빌드하므로 docker build 를 따로 부르지 않는다)
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 300
        env:
          DB_PASSWORD: ci-test-password

      - name: Health check
        run: curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"UP"'

      # 인증 사진 경로가 볼륨 마운트 지점과 같은지, 그리고 non-root 로 쓸 수 있는지
      # 확인한다. 이 둘이 어긋나면 서버는 정상 동작하는데 재시작 때 사진만 사라진다(#76, 7-7).
      - name: Verify photo volume is writable by the app user
        run: |
          docker compose exec -T server sh -c 'test -w "$VISIT_PHOTO_STORAGE_PATH"'
          docker inspect fogapp-server \
            --format '{{range .Mounts}}{{.Destination}}{{"\n"}}{{end}}' \
            | grep -qx /app/data/visit-photos

      - name: Server logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

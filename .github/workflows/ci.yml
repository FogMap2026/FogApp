name: CI

on:
  push:
    branches: [main, dev]
  # ⚠️ branches 필터를 두지 않는다. base 를 main·dev 로 제한하면 스택 PR
  # (base 가 다른 feature 브랜치인 PR)에서 CI 가 아예 돌지 않는다 — 체크 목록이
  # 비어 있어 "통과"로 오해하기 쉬운데, 실은 실행조차 안 된 상태다(#89 에서 발견).
  # 아래 Detect changes 가 변경 없는 잡을 건너뛰므로 실행 비용은 거의 늘지 않는다.
  pull_request:
  # 손으로 돌릴 수 있게 열어 둔다. 없으면 "코드는 그대로인데 결과물만 다시 필요한"
  # 경우에 방법이 없다 — 대표적으로 배포 주소가 바뀌어 APK 를 다시 구울 때다.
  # APK 는 secrets.API_BASE_URL 을 빌드 타임에 굽기 때문에(아래 apk 잡), 시크릿만
  # 바꾸고 재실행하면 될 것 같지만 그렇지 않다. 과거 실행을 rerun 하면 paths-filter 가
  # "지금"의 dev 를 다시 비교해 app=false 로 판정하고 잡을 통째로 건너뛴다.
  workflow_dispatch:

jobs:
  # 변경된 영역 감지 — 관련 없는 잡은 건너뛴다.
  #
  # ⚠️ 수동 실행(workflow_dispatch)일 때는 필터를 무시하고 전부 true 로 둔다.
  #    수동 실행의 목적이 "변경과 무관하게 결과물을 다시 만드는 것"이라, 필터를
  #    그대로 태우면 아무 잡도 돌지 않아 실행 자체가 무의미해진다.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      server: ${{ steps.filter.outputs.server == 'true' || github.event_name == 'workflow_dispatch' }}
      container: ${{ steps.filter.outputs.container == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
            server:
              - 'server/**'
            container:
              - 'server/**'
              - 'docker-compose.yml'

  app:
    name: Flutter App
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      # 플랫폼 폴더 생성 (lib/ 는 유지)
      - name: Generate platform folders
        run: flutter create .

      # flutter create 가 만든 템플릿 기본 테스트는 우리 구조와 달라 제거.
      # (앱 테스트는 #3에서 추가)
      - name: Remove template test
        run: rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # 설치 가능한 Android APK 를 만들어 아티팩트로 올린다.
  #
  # 팀원이 Flutter·Android SDK 를 설치하지 않고도 실기기에서 결과물을 확인할 수 있게 하려는
  # 목적이다. 실행 페이지의 Artifacts 에서 apk 를 받아 폰에 설치하면 된다(출처를 알 수 없는
  # 앱 설치 허용 필요).
  #
  # 디버그 빌드인 이유: 릴리스 서명 키(keystore)가 없어도 설치되는 APK 가 나온다.
  # 스토어 배포용이 아니라 "지금 만든 걸 눈으로 본다" 가 목적이라 이걸로 충분하다.
  apk:
    name: Android APK
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # app/android 는 Gradle 9.1 · AGP 9.0 을 쓴다(app/android/gradle/wrapper 참고).
      # Gradle 9 는 JDK 17 이상을 요구하며, AGP 9 조합에서는 21 이 안전하다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 두 값은 코드가 --dart-define 으로 받게 돼 있다(app/lib/main.dart, api_client.dart).
      # 시크릿이 비어 있어도 빌드는 되지만, NAVER_MAP_CLIENT_ID 가 없으면 지도가 뜨지 않는다.
      #
      # API_BASE_URL 은 저장소 시크릿에 배포 주소를 넣어 둔다. 값이 빌드 타임에 APK 안으로
      # 구워지므로, 주소가 바뀌면 시크릿을 고친 뒤 이 워크플로를 수동 실행해 다시 구워야 한다.
      #   gh workflow run ci.yml --repo FogMap2026/FogApp --ref dev
      # (기본값 10.0.2.2 는 안드로이드 에뮬레이터에서 호스트를 가리키는 주소다.)
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://10.0.2.2:8080' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fogapp-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # iOS 빌드 + 실행 검증(7-6). macOS 러너는 공개 저장소라 무료다.
  #
  # 예전에는 컴파일만 확인했다. 그런데 Info.plist 권한 문구 누락처럼 빌드는 통과하고
  # 실행할 때만 터지는 문제가 iOS 의 대표적인 사고 유형이라, 컴파일만 봐서는
  # "iOS 도 된다" 고 말할 수 없었다.
  #
  # 그래서 시뮬레이터를 실제로 띄워 앱을 설치·실행하고, 크래시하지 않는지 확인한 뒤
  # 스크린샷을 아티팩트로 남긴다. Apple Developer 계정도 Mac 도 필요 없다.
  #
  # ⚠️ 이것으로도 못 잡는 것: 카메라(시뮬레이터에 없다), 실제 GPS 정확도, 실기기 성능.
  #    그건 실기기에서만 확인된다.
  ios:
    name: iOS Build
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      # CocoaPods 의존성 캐시 — 캐시 없으면 pod install 에만 3분 넘게 걸린다.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('app/pubspec.lock', 'app/ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install dependencies
        run: flutter pub get

      # 시뮬레이터 대상으로 빌드한다 — 서명이 아예 필요 없다.
      #
      # `flutter build ios --no-codesign` 은 쓰지 않는다. 그건 실기기용 패키징이라
      # 컴파일이 끝난 뒤 마지막 단계에서 Development Team 을 요구하고, Apple Developer
      # 계정이 없으면 실패한다(실제로 그렇게 실패했다). 시뮬레이터 빌드는 그 단계가 없어
      # "iOS 에서 컴파일되는가" 만 확인하려는 우리 목적에 정확히 맞는다.
      #
      # ios/ 스캐폴딩은 저장소에 커밋돼 있으므로 flutter create 로 덮지 않는다.
      #
      # dart-define 을 함께 넣는다 — 실행까지 확인할 것이라, 지도 클라이언트 ID 가 없으면
      # 지도가 뜨지 않아 "실행됨" 의 의미가 절반으로 준다.
      - name: Build for simulator
        run: |
          flutter build ios --simulator \
            --dart-define=NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8080' }}

      # ── 여기부터 실행 검증 ──────────────────────────────────────────────
      #
      # 러너 이미지마다 설치된 시뮬레이터 목록이 달라, 기기 이름을 하드코딩하지 않는다.
      # 사용 가능한 iOS 런타임의 iPhone 중 마지막 것(대체로 최신)을 고른다.
      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[]
                      | select(.key | test("iOS"))
                      | .value[] | select(.name | test("^iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::쓸 수 있는 iPhone 시뮬레이터가 없습니다."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and launch
        run: |
          xcrun simctl install "$SIM_UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIM_UDID" com.fogapp.fogapp

      # 첫 프레임까지 시간이 걸린다. Firebase 초기화·지도 SDK 로딩이 여기서 터지면
      # 아래 크래시 검사에 걸린다.
      - name: Give the app time to settle
        run: sleep 30

      - name: Screenshot
        run: xcrun simctl io "$SIM_UDID" screenshot ios-launch.png

      # 실행 직후 죽는 것이 iOS 에서 가장 흔한 실패다. 크래시 리포트가 남았거나
      # 프로세스가 사라졌으면 실패로 본다 — 스크린샷만 찍으면 검은 화면도 통과한다.
      - name: Fail if the app crashed
        run: |
          if compgen -G "$HOME/Library/Logs/DiagnosticReports/Runner*.ips" > /dev/null; then
            echo "::error::앱이 실행 직후 크래시했습니다."
            cat "$HOME"/Library/Logs/DiagnosticReports/Runner*.ips
            exit 1
          fi
          if ! xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q com.fogapp.fogapp; then
            echo "::error::앱 프로세스가 살아 있지 않습니다."
            exit 1
          fi
          echo "앱이 실행된 채로 유지되고 있습니다."

      - name: App logs on failure
        if: failure()
        run: |
          xcrun simctl spawn "$SIM_UDID" log show --last 5m \
            --predicate 'processImagePath CONTAINS "Runner"' || true

      # 실패했을 때도 올린다 — 검은 화면인지, 권한 팝업에서 멈췄는지는 그림을 봐야 안다.
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-screenshot
          path: app/ios-launch.png
          retention-days: 14

  # 서명 없는 .ipa 를 만들 수 있는지 알아보는 실험 잡이다(7-6).
  #
  # 성공하면 Apple Developer 계정($99/년) 없이도 팀원이 실기기에 넣어볼 길이 생긴다 —
  # 각자 Windows PC 에서 Sideloadly/AltStore 로 무료 Apple ID 서명해 설치하는 방식이다.
  # (그 방식의 제약: 7일마다 재설치, 폰당 3개, 푸시 알림 불가)
  #
  # ⚠️ 될지 확실하지 않다. 예전에 `flutter build ios --no-codesign` 이 Development Team 을
  #    요구하며 실패한 기록이 있다. 그래서 xcodebuild 우회를 2차로 시도하고, 잡 전체를
  #    continue-on-error 로 둔다 — 실패해도 CI 는 초록이고, 결과만 확인한다.
  ios-ipa:
    name: iOS Unsigned IPA (실험)
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # 1차 — flutter 가 알아서 해주면 가장 깔끔하다.
      - name: Try flutter build ios --no-codesign
        id: flutter_nosign
        continue-on-error: true
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=NAVER_MAP_CLIENT_ID=${{ secrets.NAVER_MAP_CLIENT_ID }} \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'http://localhost:8080' }}

      # 2차 — 서명 단계를 xcodebuild 수준에서 통째로 끈다.
      # 1차가 성공했으면 건너뛴다.
      - name: Fall back to xcodebuild with signing disabled
        if: steps.flutter_nosign.outcome == 'failure'
        continue-on-error: true
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/ios-unsigned \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build

      # .ipa 는 Payload/ 안에 .app 을 넣고 zip 으로 묶은 것이 전부다.
      - name: Package unsigned .ipa
        id: package
        run: |
          APP=""
          for candidate in build/ios/iphoneos/Runner.app \
                           build/ios-unsigned/Build/Products/Release-iphoneos/Runner.app; do
            if [ -d "$candidate" ]; then APP="$candidate"; break; fi
          done
          if [ -z "$APP" ]; then
            echo "::warning::서명 없는 .app 을 만들지 못했습니다 — 두 방법 모두 실패."
            exit 1
          fi
          echo "사용한 빌드 결과: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FogApp-unsigned.ipa Payload
          ls -lh FogApp-unsigned.ipa

      - name: Upload unsigned .ipa
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fogapp-unsigned-ipa
          path: app/FogApp-unsigned.ipa
          retention-days: 14

  server:
    name: Spring Boot Server
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Spring Boot 3.3.x 는 Gradle 8.x 필요 (9.x 는 호환 불가)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Build
        run: gradle build --no-daemon

  # 서버 이미지가 실제로 빌드되고, 뜨고, 요청을 받는지 확인한다(#86).
  # Dockerfile 이 깨진 건 배포 직전에 알게 되면 늦다.
  container:
    name: Server Container
    needs: changes
    if: ${{ needs.changes.outputs.container == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 빌드 성공 != 동작. 이미지를 만들고 DB 와 함께 실제로 기동시킨다 —
      # Flyway 마이그레이션 실패나 잘못된 ENTRYPOINT 는 빌드만으로는 안 잡힌다.
      # (compose 가 server 이미지를 빌드하므로 docker build 를 따로 부르지 않는다)
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 300
        env:
          DB_PASSWORD: ci-test-password

      - name: Health check
        run: curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"UP"'

      # 인증 사진 경로가 볼륨 마운트 지점과 같은지, 그리고 non-root 로 쓸 수 있는지
      # 확인한다. 이 둘이 어긋나면 서버는 정상 동작하는데 재시작 때 사진만 사라진다(#76, 7-7).
      - name: Verify photo volume is writable by the app user
        run: |
          docker compose exec -T server sh -c 'test -w "$VISIT_PHOTO_STORAGE_PATH"'
          docker inspect fogapp-server \
            --format '{{range .Mounts}}{{.Destination}}{{"\n"}}{{end}}' \
            | grep -qx /app/data/visit-photos

      - name: Server logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
